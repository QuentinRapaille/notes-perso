// ===================== DELETE / EDIT GAME =====================
function deleteGame(idx) {
  var g = DB.games[idx];
  if (!confirm('Supprimer la partie sur ' + g.map + ' du ' + g.date + ' ?\nCette action est irreversible.')) return;
  // Remove from sessions
  var sessions = DB.sessions;
  sessions.forEach(function(s) {
    var i = s.gameIds.indexOf(g.id);
    if (i !== -1) s.gameIds.splice(i, 1);
  });
  DB.sessions = sessions;
  var as = DB.activeSess;
  if (as) {
    var ai = as.gameIds.indexOf(g.id);
    if (ai !== -1) { as.gameIds.splice(ai, 1); DB.activeSess = as; }
  }
  var games = DB.games;
  games.splice(idx, 1);
  DB.games = games;
  goHome();
}

// S.editGameIdx holds the index being edited
// S.editRounds holds the mutable working copy of rounds

function openEditGame(idx) {
  S.editGameIdx = idx;
  var g = DB.games[idx];
  // Deep copy rounds
  S.editRounds = g.rounds.map(function(r) {
    var copy = { role: r.role, operator: r.operator, kills: r.kills, result: r.result };
    if (r.site) copy.site = r.site;
    return copy;
  });
  document.getElementById('gedit-back').onclick = function() { showGameDetail(idx); };
  renderEditGame();
  goScreen('s-gedit');
}

function renderEditGame() {
  var idx = S.editGameIdx;
  var g = DB.games[idx];
  var rounds = S.editRounds;
  var el = document.getElementById('gedit-content');

  var opsAtk = sortArr(DB.opsAtk);
  var opsDef = sortArr(DB.opsDef);

  function opOptions(role, selected) {
    var list = role === 'Attaquant' ? opsAtk : opsDef;
    return list.map(function(op) {
      return '<option value="'+op+'"'+(op===selected?' selected':'')+'>'+op+'</option>';
    }).join('');
  }

  function killPicker(roundIdx, kills) {
    var btns = '';
    for (var k = 0; k <= 5; k++) {
      var isSel = k === kills;
      var isAce = k === 5;
      btns += '<button class="kbtn-sm'+(isSel?' sel':'')+(isSel&&isAce?' ace':'')+
        '" onclick="editSetKills('+roundIdx+','+k+',this)">'+(isAce?'ACE':k)+'</button>';
    }
    return '<div class="kpicker-sm" id="kpicker-'+roundIdx+'">' + btns + '</div>';
  }

  var html = '';

  // Map selector
  var mapOpts = sortArr(DB.maps).map(function(m) {
    return '<option value="'+m+'"'+(m===g.map?' selected':'')+'>'+m+'</option>';
  }).join('');
  html += '<div class="card" style="margin-bottom:12px">'+
    '<div class="card-title">Informations de la partie</div>'+
    '<div class="input-group"><label>Map</label><select id="gedit-map">'+mapOpts+'</select></div>'+
    '</div>';

  // Each round
  html += '<div class="card" style="margin-bottom:12px"><div class="card-title">Manches</div>';
  rounds.forEach(function(r, i) {
    var isAtk = r.role === 'Attaquant';
    var siteField = '';
    var sites = getBombSites(g.map);
    if (sites) {
      var siteOpts = '<option value="">&mdash; Aucun &mdash;</option>' + sites.map(function(s) {
        return '<option value="'+s.n+'"'+(r.site===s.n?' selected':'')+'>'+s.c+' - '+s.n+'</option>';
      }).join('');
      siteField = '<div class="input-group" style="margin-top:8px"><label>Site de bombe</label>'+
        '<select id="esite-'+i+'" onchange="editSetSite('+i+',this.value)">'+siteOpts+'</select></div>';
    }
    html += '<div class="edit-round-row" id="eround-'+i+'">'+
      '<div class="edit-round-header">'+
      '<span class="edit-round-label">Manche '+(i+1)+'</span>'+
      '<span class="badge '+(isAtk?'ba':'bd')+'">'+(isAtk?'ATK':'DEF')+'</span>'+
      (rounds.length > 1 ? '<button class="btn btn-sm btn-danger" onclick="editRemoveRound('+i+')" style="padding:4px 8px;font-size:10px">Suppr.</button>' : '')+
      '</div>'+
      '<div class="edit-row-fields">'+
      '<div class="input-group"><label>Operateur</label><select id="eop-'+i+'" onchange="editSetOp('+i+',this.value)">'+opOptions(r.role, r.operator)+'</select></div>'+
      '<div class="input-group"><label>Resultat</label>'+
      '<div class="rtoggle">'+
      '<button class="rbtn win'+(r.result==='win'?' sel':'')+'" onclick="editSetResult('+i+',\'win\',this)">Victoire</button>'+
      '<button class="rbtn loss'+(r.result==='loss'?' sel':'')+'" onclick="editSetResult('+i+',\'loss\',this)">Defaite</button>'+
      '</div></div>'+
      '</div>'+
      '<div class="input-group" style="margin-top:8px"><label>Kills</label>'+killPicker(i, r.kills)+'</div>'+
      siteField+
      '</div>';
  });
  html += '<button class="btn btn-full" style="margin-top:4px" onclick="editAddRound()">&#43; Ajouter une manche</button>';
  html += '</div>';

  // Danger zone
  html += '<div style="display:flex;gap:8px;margin-bottom:12px">'+
    '<button class="btn btn-primary" style="flex:2" onclick="saveEditGame()">&#10003; Sauvegarder les modifications</button>'+
    '</div>'+
    '<div class="danger-zone">'+
    '<div class="danger-zone-title">&#9888; Zone de danger</div>'+
    '<button class="btn btn-danger btn-full" onclick="deleteGame('+idx+')">Supprimer cette partie</button>'+
    '</div>';

  el.innerHTML = html;
}

function editSetKills(roundIdx, kills, btn) {
  S.editRounds[roundIdx].kills = kills;
  var picker = document.getElementById('kpicker-' + roundIdx);
  picker.querySelectorAll('.kbtn-sm').forEach(function(b, k) {
    b.classList.toggle('sel', k === kills);
    b.classList.toggle('ace', k === kills && k === 5);
  });
}

function editSetOp(roundIdx, val) {
  S.editRounds[roundIdx].operator = val;
}

function editSetSite(roundIdx, val) {
  if (val) S.editRounds[roundIdx].site = val;
  else delete S.editRounds[roundIdx].site;
}

function editSetResult(roundIdx, result, btn) {
  S.editRounds[roundIdx].result = result;
  var row = document.getElementById('eround-' + roundIdx);
  row.querySelectorAll('.rbtn').forEach(function(b) {
    b.classList.remove('sel');
  });
  btn.classList.add('sel');
}

function editRemoveRound(roundIdx) {
  S.editRounds.splice(roundIdx, 1);
  renderEditGame();
}

function editAddRound() {
  var g = DB.games[S.editGameIdx];
  var i = S.editRounds.length;
  var role = (i % 2 === 0) ? g.firstRole : (g.firstRole === 'Attaquant' ? 'Defenseur' : 'Attaquant');
  var defaultOp = role === 'Attaquant' ? sortArr(DB.opsAtk)[0] : sortArr(DB.opsDef)[0];
  S.editRounds.push({ role: role, operator: defaultOp, kills: 0, result: 'win' });
  renderEditGame();
}

function saveEditGame() {
  var idx = S.editGameIdx;
  var games = DB.games;
  var g = games[idx];

  // Update map
  var newMap = document.getElementById('gedit-map').value;
  g.map = newMap;
  g.rounds = S.editRounds.slice();

  // Recompute result
  var wins = g.rounds.filter(function(r) { return r.result === 'win'; }).length;
  var losses = g.rounds.filter(function(r) { return r.result === 'loss'; }).length;
  g.result = wins > losses ? 'win' : losses > wins ? 'loss' : 'draw';

  DB.games = games;
  showGameDetail(idx);
}

// Shared entrance animation for the stats content: fades/slides the whole
// block in, then (re)triggers the bar-rise / count-up animations on the bars
// and big numbers inside it. Called after every tab switch, from wherever it
// happens (direct tab click, opening stats fresh, or returning from a detail
// screen), so the transition is consistent everywhere.
function animateStatsContentIn() {
  var content = document.getElementById('stats-content');
  if (content) {
    content.style.animation = 'none';
    content.offsetHeight;
    content.style.animation = 'fadeSlideUp .3s cubic-bezier(.22,1,.36,1) both';

// ===================== OPERATORS TAB =====================
function buildOpStats(rounds, games) {
  // Per-operator, per-map detail
  var m = {};
  rounds.forEach(function(r) {
    var op = r.operator;
    if (!m[op]) m[op] = { role: r.role, total: 0, wins: 0, kills: 0, aces: 0, maps: {}, killsWhenWin: 0 };
    m[op].total++;
    m[op].kills += r.kills;
    if (r.kills === 5) m[op].aces++;
    if (r.result === 'win') { m[op].wins++; m[op].killsWhenWin += r.kills; }
    if (!m[op].maps[r._map]) m[op].maps[r._map] = { total: 0, wins: 0, kills: 0 };
    m[op].maps[r._map].total++;
    if (r.result === 'win') m[op].maps[r._map].wins++;
    m[op].maps[r._map].kills += r.kills;
  });
  // Inject map info from games into rounds first
  var roundsWithMap = [];
  games.forEach(function(g) {
    g.rounds.forEach(function(r) {
      roundsWithMap.push({ op: r.operator, map: g.map, kills: r.kills, result: r.result, role: r.role });
    });
  });
  var m2 = {};
  roundsWithMap.forEach(function(r) {
    var op = r.op;
    if (!m2[op]) m2[op] = { role: r.role, total: 0, wins: 0, kills: 0, aces: 0, maps: {} };
    m2[op].total++;
    m2[op].kills += r.kills;
    if (r.kills === 5) m2[op].aces++;
    if (r.result === 'win') m2[op].wins++;
    if (!m2[op].maps[r.map]) m2[op].maps[r.map] = { total: 0, wins: 0, kills: 0 };
    m2[op].maps[r.map].total++;
    if (r.result === 'win') m2[op].maps[r.map].wins++;
    m2[op].maps[r.map].kills += r.kills;
  });
  // Also compute "win rate when you get a kill" per op
  var killWinMap = {};
  roundsWithMap.forEach(function(r) {
    if (!killWinMap[r.op]) killWinMap[r.op] = { withKill: 0, withKillWin: 0 };
    if (r.kills > 0) {
      killWinMap[r.op].withKill++;
      if (r.result === 'win') killWinMap[r.op].withKillWin++;
    }
  });
  var res = {};
  Object.keys(m2).forEach(function(op) {
    var v = m2[op];
    var kw = killWinMap[op] || { withKill: 0, withKillWin: 0 };
    res[op] = {
      role: v.role,
      total: v.total,
      wins: v.wins,
      kills: v.kills,
      aces: v.aces,
      winRate: Math.round(v.wins / v.total * 100),
      avgKills: parseFloat((v.kills / v.total).toFixed(2)),
      killWinRate: kw.withKill ? Math.round(kw.withKillWin / kw.withKill * 100) : null,
      withKillRounds: kw.withKill,
      maps: v.maps
    };
  });
  return res;
}

function renderOperatorsList(el, rounds, games) {
  var ops = buildOpStats(rounds, games);
  if (!Object.keys(ops).length) { el.innerHTML = '<div class="empty">Pas encore de donnees</div>'; return; }

  var cols = [
    { key: 'total', label: 'Manches' },
    { key: 'winRate', label: 'WR%' },
    { key: 'avgKills', label: 'Moy.K' },
    { key: 'aces', label: 'Aces' },
    { key: 'killWinRate', label: 'WR si kill%' }
  ];

  var col = S.opSortCol || 'total';
  var dir = S.opSortDir || -1;

  var allOps = Object.keys(ops).map(function(k) { return [k, ops[k]]; });
  allOps.sort(function(a, b) {
    var av = a[1][col] === null ? -1 : a[1][col];
    var bv = b[1][col] === null ? -1 : b[1][col];
    return dir * (bv - av);
  });

  var atk = allOps.filter(function(x) { return x[1].role === 'Attaquant'; });
  var def = allOps.filter(function(x) { return x[1].role === 'Defenseur'; });

  function thBtn(key, label) {
    var active = col === key;
    var arrow = active ? (dir === -1 ? ' &#9660;' : ' &#9650;') : '';

        '<td>'+v.total+'</td>'+

    }).join('');
  }

  var legend = '<div style="display:flex;gap:16px;font-size:11px;color:var(--text3);margin-bottom:14px;padding:0 2px">'+
    '<span style="display:flex;align-items:center;gap:5px"><span style="width:10px;height:10px;background:var(--atk);border-radius:2px;display:inline-block"></span>Attaque</span>'+
    '<span style="display:flex;align-items:center;gap:5px"><span style="width:10px;height:10px;background:var(--def);border-radius:2px;display:inline-block"></span>Defense</span>'+
    '<span style="font-size:10px;color:var(--text3);margin-left:auto">Cliquer un operateur pour le detail</span>'+
    '</div>';

  var tableHead = '<table class="xtable" style="width:100%">'+
    '<thead><tr>'+
    '<th>Operateur</th>'+
    thBtn('total','Mnch.')+
    thBtn('winRate','WR%')+
    thBtn('avgKills','Moy.K')+
    thBtn('aces','Aces')+
    thBtn('killWinRate','WR si K')+
    '<th>Meilleure map</th>'+
    '</tr></thead>';

  var html = legend;
  if (atk.length) {
    html += '<div class="card" style="margin-bottom:12px"><div class="card-title" style="color:var(--atk)">&#9658; Attaquants</div>'+
      tableHead + '<tbody>' + opRows(atk) + '</tbody></table></div>';
  }

function buildMapStats(games) {
  var m = {};
  games.forEach(function(g) {
    var mp = g.map;
    if (!m[mp]) m[mp] = { total: 0, wins: 0, kills: 0, aces: 0, ops: {} };
    m[mp].total++;
    if (g.result === 'win') m[mp].wins++;
    g.rounds.forEach(function(r) {
      m[mp].kills += r.kills;
      if (r.kills === 5) m[mp].aces++;
      var op = r.operator;
      if (!m[mp].ops[op]) m[mp].ops[op] = { role: r.role, total: 0, wins: 0, kills: 0 };
      m[mp].ops[op].total++;
      if (r.result === 'win') m[mp].ops[op].wins++;
      m[mp].ops[op].kills += r.kills;
    });
  });
  var res = {};
  Object.keys(m).forEach(function(mp) {
    var v = m[mp];
    var totalRounds = games.filter(function(g){ return g.map===mp; }).reduce(function(s,g){ return s+g.rounds.length; },0);
    res[mp] = {
      total: v.total,
      wins: v.wins,
      kills: v.kills,
      aces: v.aces,
      winRate: Math.round(v.wins / v.total * 100),
      avgKillsPerRound: totalRounds ? parseFloat((v.kills / totalRounds).toFixed(2)) : 0,
      totalRounds: totalRounds,
      ops: v.ops
    };
  });
  return res;
}

function aceBars(rounds){
  var m={};
  rounds.forEach(function(r){ if(!m[r.operator]) m[r.operator]=0; if(r.kills===5) m[r.operator]++; });
  var sorted=Object.keys(m).filter(function(k){ return m[k]>0; }).map(function(k){ return [k,m[k]]; }).sort(function(a,b){ return b[1]-a[1]; });
  if(!sorted.length) return '<div class="empty" style="padding:1rem">Aucun ace</div>';
  var max=sorted[0][1];
  return sorted.map(function(e){ return '<div class="srow"><span class="sname">'+e[0]+'</span>'+
    '<div class="sbar-wrap"><div class="sbar" style="width:'+Math.round(e[1]/max*100)+'%;background:#ffe88a"></div></div>'+
    '<span class="sval">'+e[1]+' ace'+(e[1]>1?'s':'')+'</span></div>'; }).join('');
}
function renderCalendarScreen() {
  var games = DB.games;
  var years = {};
  games.forEach(function(g) {
    var p = (g.date || '').split('/');
    if (p.length === 3) years[p[2]] = true;
  });
  var yearList = Object.keys(years).map(Number);
  var curYear = new Date().getFullYear();
  if (yearList.indexOf(curYear) === -1) yearList.push(curYear);
  yearList.sort(function(a, b) { return b - a; });

  if (!S.calYear || yearList.indexOf(S.calYear) === -1) S.calYear = yearList[0];

  var yearsEl = document.getElementById('cal-years');
  yearsEl.innerHTML = yearList.map(function(y) {
    return '<button class="btn btn-sm' + (y === S.calYear ? ' btn-primary' : '') + '" onclick="setCalYear(' + y + ')">' + y + '</button>';
  }).join('');

  document.getElementById('cal-content').innerHTML = renderCalendarHeatmap(games, S.calYear);
}

function setCalYear(y) {
  S.calYear = y;
  renderCalendarScreen();
}

function renderCalendarHeatmap(games, year) {
  var counts = {};
  games.forEach(function(g) {
    var p = (g.date || '').split('/');
    if (p.length !== 3) return;
    var key = p[2] + '-' + p[1] + '-' + p[0];
    counts[key] = (counts[key] || 0) + 1;
  });

  var RANK_HEX = { Rookie:'#4caf70', Bronze:'#cd7f32', Silver:'#aab8c2', Gold:'#ffd700', Platinium:'#40e0d0', Diamond:'#6a3aa0', Master:'#e0556f' };
  var NO_RANK_HEX = '#e2883c';
  var BG_HEX = '#1a1a24';

  function hexToRgb(hex) {
    hex = hex.replace('#', '');
    if (hex.length === 3) hex = hex.split('').map(function(c){ return c+c; }).join('');
    var num = parseInt(hex, 16);
    return [(num >> 16) & 255, (num >> 8) & 255, num & 255];
  }
  function mixHex(hexA, hexB, ratio) {
    var a = hexToRgb(hexA), b = hexToRgb(hexB);
    var r = Math.round(a[0]*ratio + b[0]*(1-ratio));
    var g = Math.round(a[1]*ratio + b[1]*(1-ratio));
    var bl = Math.round(a[2]*ratio + b[2]*(1-ratio));
    return 'rgb(' + r + ',' + g + ',' + bl + ')';
  }

  // Determine the rank (if any) of the last game played on each day
  var dayRank = {};
  var dayLastId = {};
  games.forEach(function(g) {
    var p2 = (g.date || '').split('/');
    if (p2.length !== 3) return;
    var key = p2[2] + '-' + p2[1] + '-' + p2[0];
    if (dayLastId[key] === undefined || g.id > dayLastId[key]) {
      dayLastId[key] = g.id;
      dayRank[key] = g.rank ? g.rank.tier : null;
    }
  });

  function pad2(n) { return n < 10 ? '0' + n : '' + n; }
  function dateKey(d) { return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate()); }

  var jan1 = new Date(year, 0, 1);
  var dec31 = new Date(year, 11, 31);

  // Align grid start to the Monday on/before Jan 1st
  var startDow = (jan1.getDay() + 6) % 7; // 0=Mon ... 6=Sun
  var gridStart = new Date(jan1);
  gridStart.setDate(gridStart.getDate() - startDow);

  // Align grid end to the Sunday on/after Dec 31st
  var endDow = (dec31.getDay() + 6) % 7;
  var gridEnd = new Date(dec31);
  gridEnd.setDate(gridEnd.getDate() + (6 - endDow));

  var days = [];
  var d = new Date(gridStart);
  while (d <= gridEnd) {
    var inYear = d.getFullYear() === year;
    var k = dateKey(d);
    days.push({ date: new Date(d), key: k, count: inYear ? (counts[k] || 0) : 0, rankTier: inYear ? (dayRank[k] || null) : null, outOfRange: !inYear });
    d.setDate(d.getDate() + 1);
  }

  var maxCount = 1;
  days.forEach(function(x) { if (!x.outOfRange && x.count > maxCount) maxCount = x.count; });

  var weeks = [];
  for (var i = 0; i < days.length; i += 7) weeks.push(days.slice(i, i + 7));

  var monthNames = ['Jan', 'Fev', 'Mar', 'Avr', 'Mai', 'Jun', 'Jul', 'Aou', 'Sep', 'Oct', 'Nov', 'Dec'];
  var monthLabelsHtml = weeks.map(function(w, wi) {
    var firstInYear = w.filter(function(x) { return !x.outOfRange; })[0];
    var label = '';
    if (firstInYear) {
      var m = firstInYear.date.getMonth();
      var prevWeekFirst = wi > 0 ? weeks[wi - 1].filter(function(x) { return !x.outOfRange; })[0] : null;
      if (!prevWeekFirst || m !== prevWeekFirst.date.getMonth()) label = monthNames[m];
    }
    return '<div class="cal-month-lbl">' + label + '</div>';
  }).join('');

  function colorForDay(count, rankTier) {
    if (count <= 0) return 'var(--cal-0)';
    var baseHex = rankTier ? (RANK_HEX[rankTier] || NO_RANK_HEX) : NO_RANK_HEX;
    var ratio = count / maxCount;
    var mixRatio = ratio <= 0.25 ? 0.35 : ratio <= 0.5 ? 0.55 : ratio <= 0.75 ? 0.75 : 1;
    return mixHex(baseHex, BG_HEX, mixRatio);
  }

  var dayLabels = ['Lun', '', 'Mer', '', 'Ven', '', '']; // rows: Mon,Tue,Wed,Thu,Fri,Sat,Sun
  var dayLabelsHtml = dayLabels.map(function(l) { return '<div class="cal-daylabel">' + l + '</div>'; }).join('');

  var gridHtml = weeks.map(function(w, wi) {
    return '<div class="cal-week" style="animation-delay:' + (wi * 0.012) + 's">' + w.map(function(x) {
      if (x.outOfRange) return '<div class="cal-day cal-future"></div>';
      var tip = x.count + (x.count > 1 ? ' parties' : ' partie') + ' le ' + x.date.toLocaleDateString('fr-FR') + (x.count && x.rankTier ? ' (' + x.rankTier + ')' : '');
      return '<div class="cal-day" style="background:' + colorForDay(x.count, x.rankTier) + '" title="' + tip + '"></div>';
    }).join('') + '</div>';
  }).join('');

  var activeDays = days.filter(function(x) { return !x.outOfRange && x.count > 0; }).length;
  var totalGamesInRange = days.reduce(function(s, x) { return s + (x.outOfRange ? 0 : x.count); }, 0);

  return '<div class="card"><div class="card-title">Activite ' + year + '</div>' +
    '<div style="overflow-x:auto">' +
    '<div class="cal-wrap">' +
    '<div class="cal-months">' + monthLabelsHtml + '</div>' +
    '<div class="cal-body">' +
    '<div class="cal-daylabels">' + dayLabelsHtml + '</div>' +
    '<div class="cal-grid">' + gridHtml + '</div>' +
    '</div></div></div>' +
    '<div class="cal-legend">Moins ' +
    '<div class="cal-day" style="background:var(--cal-0)"></div>' +
    '<div class="cal-day" style="background:' + mixHex('#c8c8d4', BG_HEX, 0.35) + '"></div>' +
    '<div class="cal-day" style="background:' + mixHex('#c8c8d4', BG_HEX, 0.55) + '"></div>' +
    '<div class="cal-day" style="background:' + mixHex('#c8c8d4', BG_HEX, 0.75) + '"></div>' +
    '<div class="cal-day" style="background:' + mixHex('#c8c8d4', BG_HEX, 1) + '"></div> Plus</div>' +
    '<div style="font-size:11px;color:var(--text3);margin-top:4px;text-align:right">La teinte de chaque jour reflete le rang de la derniere partie jouee ce jour-la (orange si non renseigne)</div>' +
    '<div style="margin-top:10px;font-size:11px;color:var(--text3)">' + activeDays + ' jour(s) actif(s) &mdash; ' + totalGamesInRange + ' partie(s) en ' + year + '</div>' +
    '</div>';
}


function groupGamesByRank(games){
  var m={};
  games.forEach(function(g){
    if (!g.rank) return;
    var idx = getRankIndex(g.rank.tier, g.rank.sub);
    if (!m[idx]) m[idx] = { label: rankLabel(g.rank), tier: g.rank.tier, total: 0, wins: 0, kills: 0, rounds: 0 };
    m[idx].total++;
    if (g.result === 'win') m[idx].wins++;
    g.rounds.forEach(function(r){ m[idx].kills += r.kills; m[idx].rounds++; });
  });
  return m;
}
function streak(games,res){ var max=0,cur=0; games.slice().reverse().forEach(function(g){ if(g.result===res){cur++;max=Math.max(max,cur);}else cur=0; }); return max; }
function mostPlayed(arr,key){ var c={}; arr.forEach(function(x){ var k=x[key]; c[k]=(c[k]||0)+1; }); return Object.keys(c).sort(function(a,b){ return c[b]-c[a]; })[0]||'--'; }

// ===================== SESSIONS =====================
function renderSessions() {
  var el=document.getElementById('sessions-content');
  var all=DB.sessions.slice().reverse();
  var html='';
  var as=DB.activeSess;
  if(as){
    var ag=DB.games.filter(function(g){ return as.gameIds.indexOf(g.id)!==-1; });
    var aw=ag.filter(function(g){ return g.result==='win'; }).length;
    var ak=[].concat.apply([],ag.map(function(g){ return g.rounds; })).reduce(function(s,r){ return s+r.kills; },0);
    var aa=[].concat.apply([],ag.map(function(g){ return g.rounds; })).filter(function(r){ return r.kills===5; }).length;
    html+='<div class="sess-card" style="border-color:rgba(155,114,207,0.6)" onclick="showSessDetail(\'active\')">'+
      '<div class="sess-card-top"><div><div class="sess-card-title">Session en cours</div><div class="sess-card-meta">Debut : '+as.startLabel+'</div></div>'+
      '<span class="badge bsession">ACTIVE</span></div>'+
      '<div class="sess-metrics">'+sm(ag.length,'Parties')+sm(aw+'-'+(ag.length-aw),'Score')+sm(ak,'Kills')+sm(aa,'Aces')+'</div></div>';
  }
  if(!all.length&&!as){ el.innerHTML='<div class="empty">Aucune session<br><br><button class="btn btn-primary" onclick="openSessionForm(null)">Creer une session</button></div>'; return; }
  all.forEach(function(s,si){
    var realIdx=DB.sessions.length-1-si;
    var sg=DB.games.filter(function(g){ return s.gameIds.indexOf(g.id)!==-1; });
    var sw=sg.filter(function(g){ return g.result==='win'; }).length;
    var sl=sg.length-sw;
    var sk=[].concat.apply([],sg.map(function(g){ return g.rounds; })).reduce(function(s,r){ return s+r.kills; },0);
    var sa=[].concat.apply([],sg.map(function(g){ return g.rounds; })).filter(function(r){ return r.kills===5; }).length;
    var swr=sg.length?Math.round(sw/sg.length*100):0;
    var avgK=[].concat.apply([],sg.map(function(g){ return g.rounds; })).length?(sk/[].concat.apply([],sg.map(function(g){ return g.rounds; })).length).toFixed(1):'0';
    var dur=s.end?fmtDur(s.start,s.end):'-';
    var wrc=swr>=60?'var(--win)':swr<=40?'var(--loss)':'var(--text)';
    var lbl=s.label||s.startLabel;
    html+='<div class="sess-card" onclick="showSessDetail('+realIdx+')">'+
      '<div class="sess-card-top">'+
      '<div><div class="sess-card-title">'+lbl+'</div><div class="sess-card-meta">'+(s.endLabel?'Fin : '+s.endLabel:'')+' '+(dur!=='-'?dur:'')+'</div></div>'+
      '<div style="display:flex;align-items:center;gap:10px">'+
      '<span style="font-size:20px;font-weight:700;color:'+wrc+'">'+swr+'%</span>'+
      '<button class="btn btn-sm btn-danger" onclick="event.stopPropagation();deleteSess('+realIdx+')" style="padding:4px 8px;font-size:10px">X</button>'+
      '</div></div>'+
      '<div class="sess-metrics">'+sm(sg.length,'Parties')+sm(sw+'-'+sl,'Score')+sm(avgK,'Moy. kills')+sm(sa,'Aces')+'</div></div>';
  });
  el.innerHTML=html||'<div class="empty">Pas encore de sessions</div>';
}

function deleteSess(idx){
  if(!confirm('Supprimer cette session ?')) return;
  var s=DB.sessions; s.splice(idx,1); DB.sessions=s; renderSessions();
}

function showSessDetail(idx, from){
  S.sessDetailFrom = from || 'sessions';
  var s=idx==='active'?DB.activeSess:DB.sessions[idx];
  if(!s) return;
  var isActive=idx==='active';
  document.getElementById('sd-title').textContent=s.label||s.startLabel;
  var sg=DB.games.filter(function(g){ return s.gameIds.indexOf(g.id)!==-1; });
  var sw=sg.filter(function(g){ return g.result==='win'; }).length;
  var sl=sg.length-sw;
  var ar=[].concat.apply([],sg.map(function(g){ return g.rounds; }));
  var sk=ar.reduce(function(s,r){ return s+r.kills; },0);
  var sa=ar.filter(function(r){ return r.kills===5; }).length;
  var swr=sg.length?Math.round(sw/sg.length*100):0;
  var avgK=ar.length?(sk/ar.length).toFixed(1):'0';
  var dur=s.end?fmtDur(s.start,s.end):'En cours';
  var wrc=swr>=60?'var(--win)':swr<=40?'var(--loss)':'var(--text)';
  var gHtml=sg.length?sg.map(function(g){
    var gi=DB.games.indexOf(g);
    var gw=g.rounds.filter(function(r){ return r.result==='win'; }).length;
    var gl=g.rounds.filter(function(r){ return r.result==='loss'; }).length;
    var gk=g.rounds.reduce(function(s,r){ return s+r.kills; },0);
    return '<div class="hist-item" onclick="showGameDetail('+gi+')">'+
      '<div class="hist-top"><span class="hist-map">'+g.map+'</span>'+
      '<span class="badge '+(g.result==='win'?'bw':'bl')+'">'+(g.result==='win'?'WIN':'LOSS')+' '+gw+'-'+gl+'</span></div>'+
      '<div class="hist-meta">'+g.date+' &mdash; '+g.rounds.length+' manche(s) &mdash; '+gk+' kills</div></div>';
  }).join(''):'<div class="empty">Aucune partie dans cette session</div>';
  var noteHtml=s.note?'<div class="card"><div class="card-title">Note</div><div style="font-size:13px;color:var(--text2)">'+s.note+'</div></div>':'';
  document.getElementById('sd-content').innerHTML=
    '<div class="metrics metrics-4" style="margin-bottom:16px">'+
    '<div class="metric"><div class="metric-val" style="color:'+wrc+'">'+swr+'%</div><div class="metric-lbl">Win rate</div></div>'+
    mk('Parties',sg.length)+mk('Moy. kills',avgK)+mk('Aces',sa)+
    '</div>'+
    '<div class="metrics metrics-2" style="margin-bottom:16px">'+mk('Score',sw+'-'+sl)+mk('Duree',dur)+'</div>'+
    noteHtml+
    '<div class="card"><div class="card-title">Parties</div>'+gHtml+'</div>'+
    (!isActive?'<button class="btn btn-full" style="margin-top:8px" onclick="openSessionForm('+idx+')">Modifier la session</button>':'');
  goScreen('s-sessdetail');
}

// ===================== SESSION FORM =====================
function openSessionForm(editIdx) {
  S.sessEditIdx=editIdx;
  var isEdit=editIdx!==null;
  var s=isEdit?DB.sessions[editIdx]:null;
  document.getElementById('sf-title').textContent=isEdit?'Modifier la session':'Nouvelle session';

  var taken={};
  DB.sessions.forEach(function(sess,si){ if(si!==editIdx) sess.gameIds.forEach(function(id){ taken[id]=true; }); });
  var as=DB.activeSess; if(as) as.gameIds.forEach(function(id){ taken[id]=true; });
  var avail=DB.games.filter(function(g){ return !taken[g.id]; });
  var selIds=s?s.gameIds.slice():[];

  var gHtml=avail.length?avail.map(function(g){
    var gw=g.rounds.filter(function(r){ return r.result==='win'; }).length;
    var gl=g.rounds.filter(function(r){ return r.result==='loss'; }).length;
    var gk=g.rounds.reduce(function(s,r){ return s+r.kills; },0);
    var chk=selIds.indexOf(g.id)!==-1;
    return '<label style="display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--border);cursor:pointer">'+
      '<input type="checkbox" data-gid="'+g.id+'" '+(chk?'checked':'')+' style="width:16px;height:16px;accent-color:var(--session);cursor:pointer">'+
      '<div style="flex:1"><div style="font-size:13px;font-weight:700;text-transform:uppercase">'+g.map+'</div>'+
      '<div style="font-size:11px;color:var(--text3)">'+g.date+' &mdash; '+gw+'-'+gl+' &mdash; '+gk+' kills</div></div>'+
      '<span class="badge '+(g.result==='win'?'bw':'bl')+'">'+(g.result==='win'?'WIN':'LOSS')+'</span></label>';
  }).join(''):'<div style="color:var(--text3);font-size:13px;padding:8px 0">Aucune partie disponible</div>';

  document.getElementById('sf-content').innerHTML=
    '<div class="card">'+
    '<div class="input-group"><label>Nom de la session (optionnel)</label>'+
    '<input type="text" id="sf-label" placeholder="Ex: Soiree du vendredi..." value="'+(s&&s.label?s.label:'')+'"></div>'+
    '<div class="input-group"><label>Note (optionnel)</label>'+
    '<input type="text" id="sf-note" placeholder="Ex: Tres bonne session..." value="'+(s&&s.note?s.note:'')+'"></div>'+
    '</div>'+
    '<div class="card"><div class="card-title">Parties a inclure</div>'+gHtml+'</div>'+
    '<button class="btn btn-primary btn-full" onclick="saveSessForm()">'+(isEdit?'Enregistrer':'Creer la session')+'</button>'+
    (isEdit?'<button class="btn btn-danger btn-full" style="margin-top:8px" onclick="deleteSessFromForm()">Supprimer la session</button>':'');

  goScreen('s-sessform');
}

function saveSessForm(){
  var label=document.getElementById('sf-label').value.trim();
  var note=document.getElementById('sf-note').value.trim();
  var cbs=document.querySelectorAll('#sf-content input[type=checkbox]');
  var ids=[];
  cbs.forEach(function(cb){ if(cb.checked) ids.push(parseInt(cb.getAttribute('data-gid'))); });
  var now=new Date();
  var sess=DB.sessions;
  if(S.sessEditIdx!==null){
    sess[S.sessEditIdx].label=label||null;
    sess[S.sessEditIdx].note=note||null;
    sess[S.sessEditIdx].gameIds=ids;
  } else {
    sess.push({id:Date.now(),start:now.toISOString(),startLabel:fmtDT(now),end:now.toISOString(),endLabel:fmtDT(now),label:label||null,note:note||null,gameIds:ids});
  }
  DB.sessions=sess;
  goScreen('s-sessions'); renderSessions();
}

function deleteSessFromForm(){
  if(!confirm('Supprimer cette session ?')) return;
  var s=DB.sessions; s.splice(S.sessEditIdx,1); DB.sessions=s;
  goScreen('s-sessions'); renderSessions();
}

// ===================== MANAGE =====================
function setManageTab(el,tab){
  document.querySelectorAll('#s-manage .tab').forEach(function(t){ t.classList.remove('active'); });
  el.classList.add('active'); S.manageTab=tab; renderManage();
}
function renderManage(){
  var tab=S.manageTab;
  var items=tab==='maps'?DB.maps:tab==='atk'?DB.opsAtk:DB.opsDef;
  var lbl=tab==='maps'?'map':'operateur';
  var iid='mi-'+tab;
  var listHtml = sortArr(items).map(function(item){
    var row;
    if (tab==='maps') {
      row = '<li class="mitem"><span style="cursor:pointer" onclick="toggleMapSites(\''+item+'\')">'+item+
        ' <span style="color:var(--text3);font-size:10px">'+(S.manageSiteMap===item?'&#9652;':'&#9662;')+' sites</span></span>'+
        '<button class="mdel" onclick="removeItem(\''+tab+'\',\''+item+'\')">x</button></li>';
      if (S.manageSiteMap === item) {
        row += '<li class="mitem" style="display:block;background:var(--bg3);border-radius:8px;padding:10px;margin:-4px 0 8px">'+renderSiteEditor(item)+'</li>';
      }
    } else {
      row = '<li class="mitem"><span>'+item+'</span>'+
        '<button class="mdel" onclick="removeItem(\''+tab+'\',\''+item+'\')">x</button></li>';
    }
    return row;
  }).join('');
  document.getElementById('manage-content').innerHTML=
    '<div class="card"><div class="card-title">'+(tab==='maps'?'Maps':tab==='atk'?'Operateurs Attaque':'Operateurs Defense')+'</div>'+
    '<ul class="manage-list">'+listHtml+'</ul>'+
    '<div class="add-row">'+
    '<input type="text" id="'+iid+'" placeholder="Ajouter un '+lbl+'..." onkeydown="if(event.key===\'Enter\')addItem(\''+tab+'\')">'+
    '<button class="btn btn-primary btn-sm" onclick="addItem(\''+tab+'\')">Ajouter</button>'+
    '</div></div>';
}
function toggleMapSites(map) {
  S.manageSiteMap = (S.manageSiteMap === map) ? null : map;
  renderManage();
}
function renderSiteEditor(map) {
  var sites = getBombSites(map) || [];
  var id = idSafe(map);
  var rows = sites.length ? sites.map(function(s, i){
    return '<div style="display:flex;align-items:center;gap:6px;margin-bottom:4px">'+
      '<span style="flex:1;font-size:12px">'+s.c+' - '+s.n+'</span>'+
      '<button class="mdel" onclick="removeBombSite(\''+map+'\','+i+')">x</button></div>';
  }).join('') : '<div style="font-size:12px;color:var(--text3);margin-bottom:6px">Aucun site de bombe pour cette map</div>';

  return '<div style="font-size:11px;color:var(--text3);text-transform:uppercase;letter-spacing:.05em;margin-bottom:6px">Sites de bombe &mdash; '+map+'</div>'+
    rows+
    '<div style="display:flex;gap:6px;margin-top:8px">'+
    '<input type="text" id="site-code-'+id+'" placeholder="1, 2, B..." style="width:50px">'+
    '<input type="text" id="site-name-'+id+'" placeholder="Nom du site..." style="flex:1" onkeydown="if(event.key===\'Enter\')addBombSite(\''+map+'\')">'+
    '<button class="btn btn-primary btn-sm" onclick="addBombSite(\''+map+'\')">Ajouter</button>'+
    '</div>';
}
function addItem(tab){
  var val=document.getElementById('mi-'+tab).value.trim();
  if(!val) return;
  var arr=tab==='maps'?DB.maps:tab==='atk'?DB.opsAtk:DB.opsDef;
  if(arr.indexOf(val)!==-1){ alert(val+' existe deja.'); return; }
  arr.push(val);
  if(tab==='maps') DB.maps=arr; else if(tab==='atk') DB.opsAtk=arr; else DB.opsDef=arr;
  autoPushToGist();
  renderManage();
}
function removeItem(tab,item){
  if(!confirm('Supprimer "'+item+'" ?')) return;
  var arr=tab==='maps'?DB.maps:tab==='atk'?DB.opsAtk:DB.opsDef;
  var i=arr.indexOf(item); if(i!==-1) arr.splice(i,1);
  if(tab==='maps') DB.maps=arr; else if(tab==='atk') DB.opsAtk=arr; else DB.opsDef=arr;
  if (tab==='maps') {
    if (S.manageSiteMap === item) S.manageSiteMap = null;
    var bs = ensureBombSitesInit();
    if (bs[item]) { delete bs[item]; DB.bombSites = bs; }
  }
  autoPushToGist();
  renderManage();
}

// ===================== RESET =====================
function doReset(){
  if(confirm('Supprimer toutes les parties et sessions ? Action irreversible.')){
    DB.games=[]; DB.sessions=[]; DB.activeSess=null;
    renderHome();
  }
}


// ===================== RANK SYSTEM =====================
var TIERS = ['Rookie','Bronze','Silver','Gold','Platinium','Diamond'];
var SUBS  = ['IV','III','II','I'];

function getRankIndex(tier, sub) {
  // Master = index 24, others 0-23
  if (tier === 'Master') return 24;
  return TIERS.indexOf(tier) * 4 + SUBS.indexOf(sub);
}
function getRankFromIndex(idx) {
  if (idx >= 24) return { tier: 'Master', sub: null };
  if (idx < 0)   idx = 0;
  return { tier: TIERS[Math.floor(idx / 4)], sub: SUBS[idx % 4] };
}
function rankLabel(r) {
  if (!r) return '';
  return r.tier === 'Master' ? 'Master' : r.tier + ' ' + r.sub;
}
function rankColor(tier) {
  var m = { Rookie:'#4caf70', Bronze:'#cd7f32', Silver:'#aab8c2',
            Gold:'#ffd700', Platinium:'#40e0d0', Diamond:'#6a3aa0', Master:'#e0556f' };
  return m[tier] || 'var(--text)';
}
function updateAccentColors() {
  var r = loadPlayerRank();
  var col = r ? rankColor(r.tier) : '#9b72cf';
  document.documentElement.style.setProperty('--btn-col', col);
}
function loadPlayerRank() {
  try { return JSON.parse(localStorage.getItem('r6_playerrank') || 'null'); } catch(e) { return null; }
}
function savePlayerRank(r) {
  try { localStorage.setItem('r6_playerrank', JSON.stringify(r)); } catch(e) {}
}
function setRank(idx) {
  var r = getRankFromIndex(idx);
  if (r.tier === 'Master') r.medals = loadPlayerRank() && loadPlayerRank().tier === 'Master' ? (loadPlayerRank().medals || 0) : 0;
  savePlayerRank(r);
  autoPushToGist();
  updateAccentColors();
  renderHome();
  if (document.getElementById('s-stats') && document.getElementById('s-stats').classList.contains('active')) renderStats();
  var goPrompt = document.getElementById('go-rank-prompt');
  if (goPrompt) goPrompt.innerHTML = rankPromptHTML();
}
function adjustMedals(delta) {
  var r = loadPlayerRank();
  if (!r || r.tier !== 'Master') return;
  r.medals = Math.max(0, (r.medals || 0) + delta);
  savePlayerRank(r);
  autoPushToGist();
  renderHome();
  if (document.getElementById('s-stats') && document.getElementById('s-stats').classList.contains('active')) renderStats();
  var goPrompt = document.getElementById('go-rank-prompt');
  if (goPrompt) goPrompt.innerHTML = rankPromptHTML();
}

function rankBannerHTML(full) {
  var r = loadPlayerRank();
  if (!r) {
    return '<div class="rank-banner"><div><div class="rank-sub">Rang actuel</div>' +
      '<div class="rank-name" style="color:var(--text3)">Non defini</div></div>' +
      '<button class="rank-btn" onclick="openRankPicker()">Definir mon rang</button></div>';
  }
  var idx = getRankIndex(r.tier, r.sub);
  var col = rankColor(r.tier);
  var label = rankLabel(r);
  var medalStr = r.tier === 'Master' ? ' <span class="rank-medal">(' + (r.medals||0) + ' medaille' + ((r.medals||0)>1?'s':'') + ')</span>' : '';

  var btns = '';
  if (r.tier === 'Master') {
    btns = '<div class="rank-btns">' +
      '<button class="rank-btn" onclick="adjustMedals(-1)">- 1 medaille</button>' +
      '<button class="rank-btn" onclick="adjustMedals(1)">+ 1 medaille</button>' +
      '<button class="rank-btn" onclick="openRankPicker()">Changer</button>' +
      '</div>';
  } else {
    var prev = idx > 0  ? getRankFromIndex(idx - 1) : null;
    var next = idx < 24 ? getRankFromIndex(idx + 1) : null;
    btns = '<div class="rank-btns">';
    if (prev) btns += '<button class="rank-btn" onclick="setRank(' + (idx-1) + ')">&#8595; ' + rankLabel(prev) + '</button>';
    if (next) btns += '<button class="rank-btn" onclick="setRank(' + (idx+1) + ')">&#8593; ' + rankLabel(next) + '</button>';
    btns += '<button class="rank-btn" onclick="openRankPicker()">Changer</button></div>';
  }

  if (full) {
    return '<div class="rank-banner" style="border-color:' + col + ';box-shadow:0 0 0 1px ' + col + ' inset;--rank-glow:' + col + '"><div>' +
      '<div class="rank-sub">Rang actuel</div>' +
      '<div class="rank-name rank-' + r.tier + '">' + label + medalStr + '</div>' +
      '</div>' + btns + '</div>';
  } else {
    // compact chip for home
    return '<span class="rank-chip" style="color:' + col + ';border-color:' + col + '">' + label +
      (r.tier==='Master' ? ' &mdash; ' + (r.medals||0) + ' med.' : '') + '</span>';
  }
}

function rankPromptHTML() {
  var r = loadPlayerRank();
  if (!r) {
    return '<div class="card-title">Ton rang</div>'+
      '<div style="font-size:12px;color:var(--text2);margin-bottom:10px">Definis ton rang actuel pour suivre ton win rate par rang.</div>'+
      '<button class="rank-btn" onclick="openRankPicker()">Definir mon rang</button>';
  }
  var idx = getRankIndex(r.tier, r.sub);
  var label = rankLabel(r);
  var html = '<div class="card-title">As-tu change de rang sur cette partie ?</div>'+
    '<div class="rank-name rank-'+r.tier+'" style="margin-bottom:10px">'+label+
    (r.tier==='Master' ? ' <span class="rank-medal">('+(r.medals||0)+' medaille'+((r.medals||0)>1?'s':'')+')</span>' : '')+
    '</div>';
  if (r.tier === 'Master') {
    html += '<div class="rank-btns">'+
      '<button class="rank-btn" onclick="adjustMedals(-1)">- 1 medaille</button>'+
      '<button class="rank-btn" onclick="adjustMedals(1)">+ 1 medaille</button>'+
      '<button class="rank-btn" onclick="openRankPicker()">Changer</button>'+
      '</div>';
  } else {
    var prev = idx > 0  ? getRankFromIndex(idx - 1) : null;
    var next = idx < 24 ? getRankFromIndex(idx + 1) : null;
    html += '<div class="rank-btns">';
    if (prev) html += '<button class="rank-btn" onclick="setRank('+(idx-1)+')">&#8595; Descendu ('+rankLabel(prev)+')</button>';
    if (next) html += '<button class="rank-btn" onclick="setRank('+(idx+1)+')">&#8593; Monte ('+rankLabel(next)+')</button>';
    html += '<button class="rank-btn" onclick="openRankPicker()">Autre changement</button>';
    html += '</div>';
  }
  return html;
}


function closeRankPicker() {
  var el = document.getElementById('rank-picker-overlay');
  if (el) el.parentNode.removeChild(el);
}
function openRankPicker() {
  var opts = '';
  TIERS.forEach(function(t) {
    SUBS.forEach(function(s) {
      var idx = getRankIndex(t, s);
      opts += '<option value="' + idx + '">' + t + ' ' + s + '</option>';
    });
  });
  opts += '<option value="24">Master</option>';
  var cur = loadPlayerRank();
  var curIdx = cur ? getRankIndex(cur.tier, cur.sub) : 0;

  // Simple modal-like overlay
  var overlay = document.createElement('div');
  overlay.id = 'rank-picker-overlay';
  overlay.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,0.7);z-index:999;display:flex;align-items:center;justify-content:center';
  overlay.innerHTML = '<div style="background:var(--bg2);border:1px solid var(--border2);border-radius:12px;padding:24px;min-width:260px">' +
    '<div style="font-size:13px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--text3);margin-bottom:14px">Choisir un rang</div>' +
    '<select id="rank-picker-sel" style="width:100%;margin-bottom:16px">' + opts + '</select>' +
    '<div style="display:flex;gap:8px">' +
    '<button class="btn btn-primary" style="flex:1" onclick="confirmRankPicker()">Confirmer</button>' +
    '<button class="btn" style="flex:1" onclick="closeRankPicker()">Annuler</button>' +
    '</div></div>';
  document.body.appendChild(overlay);
  document.getElementById('rank-picker-sel').value = String(curIdx);
}
function confirmRankPicker() {
  var idx = parseInt(document.getElementById('rank-picker-sel').value);
  setRank(idx);
  var ov=document.getElementById('rank-picker-overlay'); if(ov) ov.parentNode.removeChild(ov);
}

// ===================== EXPORT / IMPORT =====================
function triggerImport() {
  var inp = document.getElementById('import-file-input');
  inp.value = '';
  inp.onchange = function(e){ importData(e); };
  inp.click();
}
function exportData() {
  var data = {
    games:      DB.games,
    sessions:   DB.sessions,
    activeSess: DB.activeSess,
    maps:       DB.maps,
    opsAtk:     DB.opsAtk,
    opsDef:     DB.opsDef,
    bombSites:  ensureBombSitesInit(),
    'playerrank':     loadPlayerRank()
  };
  var json = JSON.stringify(data, null, 2);
  var blob = new Blob([json], {type: 'application/json'});
  var url  = URL.createObjectURL(blob);
  var a    = document.createElement('a');
  a.href   = url;
  a.download = 'r6_backup_' + new Date().toISOString().slice(0,10) + '.json';
  a.click();
  URL.revokeObjectURL(url);
}

function importData(event) {
  var file = event.target.files[0];
  if (!file) return;
  var reader = new FileReader();
  reader.onload = function(e) {
    try {
      var d = JSON.parse(e.target.result);
      if (!d.games || !Array.isArray(d.games)) { alert('Fichier invalide.'); return; }
      if (!confirm('Remplacer toutes les donnees actuelles par celles du fichier ? (' + d.games.length + ' parties)')) return;
      DB.games    = d.games    || [];
      DB.sessions = d.sessions || [];
      DB.activeSess = d.activeSess || null;
      if (d.maps)   DB.maps   = d.maps;
      if (d.opsAtk) DB.opsAtk = d.opsAtk;
      if (d.opsDef) DB.opsDef = d.opsDef;
      if (d.bombSites) DB.bombSites = d.bombSites;
      if (d['playerrank'])   savePlayerRank(d['playerrank']);
      alert(DB.games.length + ' parties importees avec succes.');
      renderHome();
    } catch(err) {
      alert('Erreur lors de la lecture du fichier : ' + err.message);
    }
    event.target.value = '';
  };
  reader.readAsText(file);
}

// ===================== CLOUD SYNC (GitHub Gist) =====================
function buildSyncPayload() {
  return {
    games: DB.games,
    sessions: DB.sessions,
    activeSess: DB.activeSess,
    maps: DB.maps,
    opsAtk: DB.opsAtk,
    opsDef: DB.opsDef,
    bombSites: ensureBombSitesInit(),
    playerrank: loadPlayerRank()
  };
}
function saveSyncCreds(token, gistId) {
  lsSet('r6_gist_token', token || '');
  lsSet('r6_gist_id', gistId || '');
}
function renderSyncScreen() {
  var token = lsGet('r6_gist_token', '');
  var gistId = lsGet('r6_gist_id', '');
  var lastSync = lsGet('r6_gist_lastsync', null);
  var el = document.getElementById('sync-content');
  el.innerHTML =
    '<div class="card"><div class="card-title">Comment ca marche</div>'+
    '<div style="font-size:12px;color:var(--text2);line-height:1.6">'+
    '1. Cree un token sur <a href="https://github.com/settings/tokens/new?scopes=gist&description=R6%20Tracker" target="_blank" style="color:var(--accent)">github.com/settings/tokens</a> (coche uniquement la case "gist").<br>'+
    '2. Colle ce token ci-dessous et clique "Creer un nouveau Gist" (une seule fois, sur un seul appareil).<br>'+
    '3. Sur ton autre appareil, renseigne le meme token et le meme identifiant de Gist, puis utilise "Recuperer".<br>'+
    '4. Apres chaque session de jeu : "Envoyer" depuis l\'appareil ou tu as joue, puis "Recuperer" sur l\'autre avant d\'y jouer.<br>'+
    '<span style="color:var(--loss)">Important</span> : ce token donne acces a tes Gists GitHub, garde-le uniquement sur tes appareils. Un Gist "prive" reste accessible via son lien direct, ce n\'est pas chiffre.'+
    '</div></div>'+
    '<div class="card" style="margin-top:12px"><div class="card-title">Identifiants</div>'+
    '<div class="input-group"><label>Token GitHub (scope gist)</label><input type="password" id="sync-token" value="'+token.replace(/"/g,'&quot;')+'" placeholder="ghp_..."></div>'+
    '<div class="input-group"><label>Identifiant du Gist</label><input type="text" id="sync-gistid" value="'+gistId.replace(/"/g,'&quot;')+'" placeholder="laisse vide si pas encore cree"></div>'+
    '<button class="btn btn-full" onclick="saveSyncCredsFromForm()">Enregistrer les identifiants</button>'+
    '</div>'+
    '<div class="card" style="margin-top:12px"><div class="card-title">Actions</div>'+
    '<button class="btn btn-primary btn-full" style="margin-bottom:8px" onclick="createSyncGist()">Creer un nouveau Gist (premiere fois)</button>'+
    '<button class="btn btn-full" style="margin-bottom:8px" onclick="pushToGist()">&#8593; Envoyer vers le cloud</button>'+
    '<button class="btn btn-full" onclick="pullFromGist()">&#8595; Recuperer depuis le cloud</button>'+
    '<div id="sync-status" style="font-size:12px;color:var(--text3);margin-top:10px;text-align:center">'+(lastSync?('Derniere synchro sur cet appareil : '+lastSync):'Aucune synchro effectuee sur cet appareil')+'</div>'+
    '</div>';
}
function saveSyncCredsFromForm() {
  var token = document.getElementById('sync-token').value.trim();
  var gistId = document.getElementById('sync-gistid').value.trim();
  saveSyncCreds(token, gistId);
  alert('Identifiants enregistres sur cet appareil.');
}
function setSyncStatus(msg) {
  var elS = document.getElementById('sync-status');
  if (elS) elS.textContent = msg;
}
function createSyncGist() {
  var token = document.getElementById('sync-token').value.trim();
  if (!token) { alert('Renseigne d\'abord ton token GitHub.'); return; }
  saveSyncCreds(token, lsGet('r6_gist_id',''));
  setSyncStatus('Creation du Gist...');
  fetch('https://api.github.com/gists', {
    method: 'POST',
    headers: { 'Authorization': 'token ' + token, 'Accept': 'application/vnd.github+json', 'Content-Type': 'application/json' },
    body: JSON.stringify({
      description: 'R6 Tracker - sauvegarde',
      public: false,
      files: { 'r6tracker.json': { content: JSON.stringify(buildSyncPayload(), null, 2) } }
    })
  }).then(function(r){
    if (!r.ok) throw new Error('HTTP ' + r.status);
    return r.json();
  }).then(function(data){
    saveSyncCreds(token, data.id);
    lsSet('r6_gist_lastsync', fmtDT(new Date()));
    renderSyncScreen();
    alert('Gist cree avec succes.\nIdentifiant a renseigner sur ton autre appareil : ' + data.id);
  }).catch(function(err){
    setSyncStatus('Erreur : ' + err.message);
  });
}
function getSyncCreds() {
  return { token: lsGet('r6_gist_token',''), gistId: lsGet('r6_gist_id','') };
}
// Core push/pull, reusable both from the sync screen (manual) and automatically
function doPushToGist(token, gistId) {
  return fetch('https://api.github.com/gists/' + gistId, {
    method: 'PATCH',
    headers: { 'Authorization': 'token ' + token, 'Accept': 'application/vnd.github+json', 'Content-Type': 'application/json' },
    body: JSON.stringify({ files: { 'r6tracker.json': { content: JSON.stringify(buildSyncPayload(), null, 2) } } })
  }).then(function(r){
    if (!r.ok) throw new Error('HTTP ' + r.status);
    return r.json();
  }).then(function(){
    lsSet('r6_gist_lastsync', fmtDT(new Date()));
    if (document.getElementById('sync-content')) renderSyncScreen();
  });
}
function doPullFromGist(token, gistId) {
  return fetch('https://api.github.com/gists/' + gistId, {
    headers: { 'Authorization': 'token ' + token, 'Accept': 'application/vnd.github+json' }
  }).then(function(r){
    if (!r.ok) throw new Error('HTTP ' + r.status);
    return r.json();
  }).then(function(data){
    var file = data.files && data.files['r6tracker.json'];
    if (!file) throw new Error('Fichier r6tracker.json introuvable dans ce Gist');
    var d = JSON.parse(file.content);
    if (!d.games || !Array.isArray(d.games)) throw new Error('Contenu invalide');
    DB.games = d.games || [];
    DB.sessions = d.sessions || [];
    DB.activeSess = d.activeSess || null;
    if (d.maps) DB.maps = d.maps;
    if (d.opsAtk) DB.opsAtk = d.opsAtk;
    if (d.opsDef) DB.opsDef = d.opsDef;
    if (d.bombSites) DB.bombSites = d.bombSites;
    if (d.playerrank) savePlayerRank(d.playerrank);
    lsSet('r6_gist_lastsync', fmtDT(new Date()));
    updateAccentColors();
    if (document.getElementById('sync-content')) renderSyncScreen();
    return d;
  });
}
function pushToGist() {
  var token = document.getElementById('sync-token').value.trim();
  var gistId = document.getElementById('sync-gistid').value.trim();
  if (!token || !gistId) { alert('Renseigne le token et l\'identifiant du Gist.'); return; }
  if (!confirm('Envoyer tes donnees actuelles vers le cloud ? Cela remplacera la version en ligne.')) return;
  saveSyncCreds(token, gistId);
  setSyncStatus('Envoi en cours...');
  doPushToGist(token, gistId).catch(function(err){
    setSyncStatus('Erreur : ' + err.message);
  });
}
function pullFromGist() {
  var token = document.getElementById('sync-token').value.trim();
  var gistId = document.getElementById('sync-gistid').value.trim();
  if (!token || !gistId) { alert('Renseigne le token et l\'identifiant du Gist.'); return; }
  if (!confirm('Recuperer les donnees du cloud ? Cela remplacera tes donnees locales sur cet appareil.')) return;
  saveSyncCreds(token, gistId);
  setSyncStatus('Recuperation en cours...');
  doPullFromGist(token, gistId).then(function(){
    alert(DB.games.length + ' parties recuperees avec succes.');
  }).catch(function(err){
    setSyncStatus('Erreur : ' + err.message);
  });
}
// Automatic, silent versions: used after finishing a game and before starting a new one.
// No confirm()/alert() popups - they must not interrupt the flow. Failures (offline, bad
// token...) are logged and reflected in the sync screen status if it happens to be open,
// but never block gameplay.
function autoPushToGist() {
  var c = getSyncCreds();
  if (!c.token || !c.gistId) return;
  doPushToGist(c.token, c.gistId).then(function(){
    setSyncStatus('Sauvegarde automatique envoyee.');
  }).catch(function(err){
    console.warn('Auto-push cloud echoue :', err.message);
    setSyncStatus('Erreur de sauvegarde automatique : ' + err.message);
  });
}
function autoPullFromGist() {
  var c = getSyncCreds();
  if (!c.token || !c.gistId) return Promise.resolve();
  setSyncStatus('Recuperation automatique en cours...');
  return doPullFromGist(c.token, c.gistId).then(function(){
    setSyncStatus('Recuperation automatique effectuee.');
  }).catch(function(err){
    console.warn('Auto-pull cloud echoue :', err.message);
    setSyncStatus('Erreur de recuperation automatique : ' + err.message);
  });
}

// ===================== INIT =====================
if (DB.activeSess) document.body.classList.add('session-active');
document.body.classList.add('home-active'); // s-home is the screen shown by default
updateAccentColors();
updateBackgrounds();
document.getElementById('app-version').textContent = APP_VERSION;
renderHome();
</script>
